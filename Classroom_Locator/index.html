<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amrita Nav</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Initial Floor Selection Prompt -->
  <div id="floor-prompt-modal" class="floor-prompt-modal" role="dialog" aria-modal="true" aria-labelledby="floor-prompt-title">
    <div class="floor-prompt-card">
      <div class="floor-prompt-header">
        <h1 class="brand-title" style="margin-bottom: 0.5rem;">Amrita Nav</h1>
        <h2 id="floor-prompt-title" class="floor-prompt-question">Which floor are you currently on?</h2>
      </div>
      <div class="floor-prompt-options">
        <button type="button" class="floor-prompt-btn" data-floor="ground">Ground Floor</button>
        <button type="button" class="floor-prompt-btn" data-floor="first">First Floor</button>
        <button type="button" class="floor-prompt-btn" data-floor="second">Second Floor</button>
        <button type="button" class="floor-prompt-btn" data-floor="third">Third Floor</button>
      </div>
    </div>
  </div>

  <div class="container">
    <header class="header">
      <div class="header-top-row">
        <h1 class="brand-title">Amrita Nav</h1>
        <div class="theme-toggle-wrapper">
          <div class="theme-switcher" role="radiogroup" aria-label="Color Theme">
            <button type="button" class="theme-btn active" id="theme-btn-light" data-theme="light" role="radio" aria-checked="true" title="Light mode">
              <span class="theme-icon">☀️</span>
              <span class="theme-text">Light</span>
            </button>
            <button type="button" class="theme-btn" id="theme-btn-dark" data-theme="dark" role="radio" aria-checked="false" title="Dark mode">
              <span class="theme-icon">🌙</span>
              <span class="theme-text">Dark</span>
            </button>
          </div>
        </div>
      </div>
      <div class="floor-switcher" role="tablist" aria-label="Floor Selection">
        <button type="button" class="floor-btn" data-floor="ground" role="tab" aria-selected="false">Ground</button>
        <button type="button" class="floor-btn" data-floor="first" role="tab" aria-selected="false">First</button>
        <button type="button" class="floor-btn" data-floor="second" role="tab" aria-selected="false">Second</button>
        <button type="button" class="floor-btn" data-floor="third" role="tab" aria-selected="false">Third</button>
      </div>

      <!-- Classroom Search Box -->
      <div class="classroom-search-container" id="classroom-search-container">
        <div class="classroom-search-box">
          <span class="search-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input
            type="text"
            id="classroom-search-input"
            class="classroom-search-input"
            placeholder="Search classroom…"
            aria-label="Search classroom"
            autocomplete="off"
            spellcheck="false"
          >
          <button type="button" id="classroom-search-clear" class="classroom-search-clear" title="Clear search" aria-label="Clear search" style="display: none;">✕</button>
          <button type="button" id="classroom-search-btn" class="classroom-search-btn" aria-label="Search">Search</button>
        </div>
        <div id="classroom-search-suggestions" class="classroom-search-suggestions" style="display: none;" role="listbox" aria-label="Search suggestions"></div>
        <div id="classroom-search-feedback" class="classroom-search-feedback" style="display: none;" role="status"></div>
      </div>

      <!-- Multi-Floor Navigation Bar -->
      <div id="ground-nav-bar" class="ground-nav-bar" style="display: none;">
        <div class="nav-control-group">
          <div class="nav-select-wrapper">
            <span class="nav-icon">🟢</span>
            <select id="nav-start-select" class="nav-select" aria-label="Starting Location">
              <option value="gps">📍 Current Location (GPS)</option>
            </select>
          </div>
          <button type="button" id="nav-swap-btn" class="nav-swap-btn" title="Swap start and destination" aria-label="Swap start and destination">⇄</button>
          <div class="nav-select-wrapper">
            <span class="nav-icon">🔴</span>
            <select id="nav-dest-select" class="nav-select" aria-label="Destination Location">
              <option value="">Select Destination...</option>
            </select>
          </div>
          <button type="button" id="get-route-btn" class="nav-btn primary">Route</button>
          <button type="button" id="clear-route-btn" class="nav-btn secondary" style="display: none;">Clear</button>
        </div>
        <div id="route-summary-bar" class="route-summary-bar" style="display: none;">
          <div class="route-metrics-group">
            <span id="route-distance-text" class="route-metric"></span>
            <span id="route-time-text" class="route-metric"></span>
          </div>
          <div id="route-floor-steps" class="route-floor-steps"></div>
          <div id="route-instruction-bar" class="route-instruction-bar" style="display: none;"></div>
        </div>
      </div>
    </header>

            <!-- GPS Live Location Marker -->

              <defs>
                <radialGradient id="gps-beam-grad" cx="0" cy="0" r="52" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45" />
