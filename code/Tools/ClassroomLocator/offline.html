<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amrita Nav — offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      max-width: 26rem;
      background: #1e293b;
      border-radius: 14px;
      padding: 1.75rem 1.5rem;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    .card h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
    .card p { font-size: 0.95rem; line-height: 1.55; margin: 0 0 1.25rem; color: #94a3b8; }
    .card button {
      font: inherit;
      font-weight: 600;
      color: #f8fafc;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.4rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📡 You're offline</h1>
    <p>
      Amrita Nav saves its campus maps, room data and navigation information
      to your browser the first time you open it with an internet connection.
      <br><br>
      Please reconnect once and open the site again — after that, everything
      will keep working even without internet.
    </p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
