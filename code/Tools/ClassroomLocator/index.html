<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amrita Nav</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Initial Floor Selection Prompt -->
  <div id="floor-prompt-modal" class="floor-prompt-modal" role="dialog" aria-modal="true" aria-labelledby="floor-prompt-title">
    <div class="floor-prompt-card">
      <div class="floor-prompt-header">
        <h1 class="brand-title">Amrita Nav</h1>
        <h2 id="floor-prompt-title" class="floor-prompt-question">Which floor are you currently on?</h2>
      </div>
      <div class="floor-prompt-options">
        <button type="button" class="floor-prompt-btn" data-floor="ground">Ground Floor</button>
        <button type="button" class="floor-prompt-btn" data-floor="first">First Floor</button>
        <button type="button" class="floor-prompt-btn" data-floor="second">Second Floor</button>
        <button type="button" class="floor-prompt-btn" data-floor="third">Third Floor</button>
      </div>
    </div>
  </div>

  <!-- ══ App Shell ══════════════════════════════════════════════ -->
  <div class="app-shell" id="app-shell">

    <!-- ── Floating Top Bar (search + floor chips + nav) ──────── -->
    <div class="floating-top-bar" id="floating-top-bar">

      <!-- Search row -->
      <div class="search-row">
        <div class="classroom-search-container" id="classroom-search-container">
          <div class="floating-search-bar">
            <span class="search-icon-wrap" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>
            <input
              type="text"
              id="classroom-search-input"
              class="classroom-search-input"
              placeholder="Search here"
              aria-label="Search classroom"
              autocomplete="off"
              spellcheck="false"
            >
            <button type="button" id="classroom-search-clear" class="classroom-search-clear" title="Clear search" aria-label="Clear search" style="display: none;">✕</button>
            <!-- Mic icon -->
            <button type="button" class="mic-btn" id="classroom-search-btn" aria-label="Search">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
              </svg>
            </button>
          </div>
          <div id="classroom-search-suggestions" class="classroom-search-suggestions" style="display: none;" role="listbox" aria-label="Search suggestions"></div>
          <div id="classroom-search-feedback" class="classroom-search-feedback" style="display: none;" role="status"></div>
        </div>
      </div>

      <!-- Category & Floor Chips -->
      <div class="chips-row" role="tablist" aria-label="Categories">
        <!-- Facility Category Chips: Washrooms, Labs, Offices -->
        <button type="button" class="category-chip" data-category="toilet" title="Restrooms">
          <span class="chip-badge chip-badge-teal">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"/><path d="M7 21v-7.5a2.5 2.5 0 0 1 5 0V21"/><path d="M12 21v-7.5a2.5 2.5 0 0 1 5 0V21"/></svg>
          </span>
          <span class="chip-label">Washrooms</span>
        </button>
        <button type="button" class="category-chip" data-category="lab" title="Laboratories">
          <span class="chip-badge chip-badge-rose">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.31L4.5 19.5A2 2 0 0 0 6.23 22h11.54a2 2 0 0 0 1.73-2.5L14 9.31V2"/></svg>
          </span>
          <span class="chip-label">Labs</span>
        </button>
        <button type="button" class="category-chip" data-category="office" title="Offices">
          <span class="chip-badge chip-badge-blue">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          </span>
          <span class="chip-label">Offices</span>
        </button>
        <button type="button" class="category-chip nearest-chip" id="nearest-toilet-btn" title="Route to the nearest washroom">
          <span class="chip-badge chip-badge-teal">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"/><path d="M7 21v-7.5a2.5 2.5 0 0 1 5 0V21"/><path d="M12 21v-7.5a2.5 2.5 0 0 1 5 0V21"/></svg>
          </span>
          <span class="chip-label">Nearest Washroom</span>
        </button>
        <button type="button" class="category-chip nearest-chip" id="nearest-stairs-btn" title="Route to the nearest staircase">
          <span class="chip-badge chip-badge-blue">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4v-4h4v-4h4V8h4V4"/></svg>
          </span>
          <span class="chip-label">Nearest Stairs</span>
        </button>
        <button type="button" class="category-chip nearest-chip" id="nearest-exit-btn" title="Route to the nearest exit / entrance">
          <span class="chip-badge chip-badge-rose">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="15 17 20 12 15 7"/><line x1="20" y1="12" x2="9" y2="12"/></svg>
          </span>
          <span class="chip-label">Nearest Exit</span>
        </button>
      </div>

      <!-- Washroom gender choice for "Nearest Washroom" -->
      <div id="washroom-choice-pop" class="washroom-choice-pop" style="display: none;" role="menu" aria-label="Choose washroom type">
        <div class="washroom-choice-title">Which washroom do you need?</div>
        <div class="washroom-choice-options">
          <button type="button" id="washroom-mens-btn" class="washroom-option mens" role="menuitem">🚹 Men's</button>
          <button type="button" id="washroom-ladies-btn" class="washroom-option ladies" role="menuitem">🚺 Ladies'</button>
        </div>
        <button type="button" id="washroom-cancel-btn" class="washroom-cancel">Cancel</button>
      </div>

      <!-- Multi-Floor Navigation Bar -->
      <button type="button" id="nav-toggle-btn" class="nav-toggle-btn" title="Route planner" aria-label="Open route planner" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21.71 11.29l-9-9a.996.996 0 0 0-1.41 0l-9 9a.996.996 0 0 0 0 1.41l9 9c.39.39 1.02.39 1.41 0l9-9a.996.996 0 0 0 0-1.41zM14 14.5V12h-4v3H8v-4c0-.55.45-1 1-1h5V7.5l3.5 3.5-3.5 3.5z"/>
        </svg>
      </button>
      <div id="ground-nav-bar" class="ground-nav-bar" style="display: none;">
        <div class="nav-control-group collapsed" id="nav-control-group">
          <div class="nav-select-wrapper" id="nav-start-wrapper">
            <label for="nav-start-input" class="nav-label">From</label>
            <div class="nav-input-container">
              <input
                type="text"
                id="nav-start-input"
                class="nav-search-input"
                placeholder="Search start location..."
                value="📍 Current Location (GPS)"
                autocomplete="off"
                spellcheck="false"
                aria-label="Starting Location"
                role="combobox"
                aria-expanded="false"
                aria-autocomplete="list"
              />
              <button type="button" id="nav-start-clear" class="nav-input-clear" title="Clear start" aria-label="Clear start">✕</button>
              <div id="nav-start-suggestions" class="nav-suggestions-dropdown" style="display: none;" role="listbox"></div>
            </div>
            <select id="nav-start-select" class="nav-select" style="display: none;" aria-hidden="true" tabindex="-1">
              <option value="gps">📍 Current Location (GPS)</option>
            </select>
          </div>
          <button type="button" id="nav-swap-btn" class="nav-swap-btn" title="Swap start and destination" aria-label="Swap start and destination">⇄</button>
          <div class="nav-select-wrapper" id="nav-dest-wrapper">
            <label for="nav-dest-input" class="nav-label">To</label>
            <div class="nav-input-container">
              <input
                type="text"
                id="nav-dest-input"
                class="nav-search-input"
                placeholder="Search destination..."
                autocomplete="off"
                spellcheck="false"
                aria-label="Destination Location"
                role="combobox"
                aria-expanded="false"
                aria-autocomplete="list"
              />
              <button type="button" id="nav-dest-clear" class="nav-input-clear" title="Clear destination" aria-label="Clear destination" style="display: none;">✕</button>
              <div id="nav-dest-suggestions" class="nav-suggestions-dropdown" style="display: none;" role="listbox"></div>
            </div>
            <select id="nav-dest-select" class="nav-select" style="display: none;" aria-hidden="true" tabindex="-1">
              <option value="">Select Destination...</option>
            </select>
          </div>
          <button type="button" id="get-route-btn" class="nav-btn primary">Route</button>
          <button type="button" id="clear-route-btn" class="nav-btn secondary" style="display: none;">Clear</button>
        </div>
        <div id="route-summary-bar" class="route-summary-bar" style="display: none;">
          <button type="button" id="route-summary-icon" class="route-summary-icon" title="Show route details" aria-label="Show route details" aria-expanded="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M21.71 11.29l-9-9a.996.996 0 0 0-1.41 0l-9 9a.996.996 0 0 0 0 1.41l9 9c.39.39 1.02.39 1.41 0l9-9a.996.996 0 0 0 0-1.41zM14 14.5V12h-4v3H8v-4c0-.55.45-1 1-1h5V7.5l3.5 3.5-3.5 3.5z"/>
            </svg>
            <span id="route-summary-icon-text" class="route-summary-icon-text"></span>
          </button>
          <div id="route-step-now" class="route-step-now"></div>
          <div class="route-summary-details">
            <div class="route-metrics-group">
              <span id="route-distance-text" class="route-metric"></span>
              <span id="route-time-text" class="route-metric"></span>
            </div>
            <div id="route-floor-steps" class="route-floor-steps"></div>
            <ol id="route-directions" class="route-directions"></ol>
            <div id="route-instruction-bar" class="route-instruction-bar" style="display: none;"></div>
          </div>
          <button type="button" id="route-summary-minimize" class="route-summary-minimize" title="Minimize route panel" aria-label="Minimize route panel">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div><!-- /floating-top-bar -->

    <main class="main-content" id="main-content" style="display: none;">
      <div class="image-wrapper">
        <div class="map-container" id="map-container">
          <div class="map-pan-stage" id="map-pan-stage">
            <!-- Ground Floor -->
          <div class="floor-layer" id="floor-layer-ground" data-floor="ground" data-orig-width="2112" data-orig-height="1300">
            <svg class="central-image floorplan-vector" viewBox="0 0 1300 2112" aria-hidden="true">
            <defs>
    <style>
      .floorplan-bg { fill: #ffffff; }
      .room-wall { stroke-linejoin: round; stroke-linecap: round; }
      .room-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: central; fill: #0f172a; pointer-events: none; }
      .room-code { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 500; text-anchor: middle; dominant-baseline: central; fill: #64748b; pointer-events: none; }
    </style>
  </defs>

        <button id="gps-toggle-btn" class="nav-arrow-btn gps-toggle-btn" type="button" aria-label="Locate Me" title="Locate Me">
          <svg class="gps-locate-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <circle class="gps-icon-halo" cx="12" cy="12" r="10" fill="#1a73e8" fill-opacity="0.2" />
            <circle class="gps-icon-border" cx="12" cy="12" r="7.5" fill="#ffffff" />
            <circle class="gps-icon-core" cx="12" cy="12" r="5" fill="#1a73e8" />
          </svg>
          <span class="gps-status-dot" id="gps-status-dot" style="display: none;"></span>
          <span class="gps-btn-text" id="gps-btn-text" style="display: none;">Locate Me</span>
        </button>
      </div>

    </div> <!-- /#map-container -->
  </div> <!-- /.image-wrapper -->
</main> <!-- /#main-content -->

    <!-- ── Room Details Popup Message (shown when room searched/selected) ── -->
    <div id="room-details-popup" class="room-details-popup" style="display: none;" role="dialog" aria-modal="false" aria-labelledby="room-popup-title">
      <div class="room-popup-card">
        <div class="room-popup-header">
          <div class="room-popup-badge-group">
            <span id="room-popup-icon" class="room-popup-icon">📍</span>
            <span id="room-popup-floor-badge" class="room-popup-floor-badge floor-ground">Ground Floor</span>
            <span id="room-popup-category-badge" class="room-popup-category-badge">Room</span>
          </div>
          <button type="button" id="room-popup-close-btn" class="room-popup-close-btn" title="Close" aria-label="Close room details">✕</button>
        </div>

        <div class="room-popup-content">
          <h2 id="room-popup-title" class="room-popup-title">Room Name</h2>
          <div class="room-popup-meta-row">
            <span id="room-popup-code-badge" class="room-popup-code-badge" style="display: none;"></span>
            <span id="room-popup-floor-name" class="room-popup-floor-name">Ground Floor</span>
          </div>
        </div>

        <div class="room-popup-footer">
          <button type="button" id="room-popup-nav-btn" class="room-popup-nav-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
            </svg>
            <span>Start Navigation</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Staircase climb prompt (shown when the user reaches a staircase mid-route) -->
    <div id="stair-popup" class="stair-popup" style="display: none;" role="alertdialog" aria-labelledby="stair-popup-title">
      <button type="button" id="stair-popup-close" class="stair-popup-close" title="Dismiss" aria-label="Dismiss">✕</button>
      <h2 id="stair-popup-title" class="stair-popup-title">Climb the stairs</h2>
      <p id="stair-popup-sub" class="stair-popup-sub"></p>
    </div>
  </div> <!-- /#app-shell -->
  <script src="ground-nav-data.js"></script>
  <script src="campus-data.js"></script>
  <script src="campus-router.js"></script>
  <script src="script.js"></script>
</body>
</html>
